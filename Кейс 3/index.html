<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слайдер изображений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slider-container">
    <h1>Галерея изображений</h1>
    <div class="slider">
      <button id="prevBtn" class="nav-btn">‹ Назад</button>
      <div class="image-container">
        <img id="currentImage" src="images/1.jpg" alt="Изображение 1">
      </div>
      <button id="nextBtn" class="nav-btn">Вперед ›</button>
    </div>
    <div class="counter" id="counter">Изображение 1 из 5</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
